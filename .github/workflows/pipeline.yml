name: Multi-Env Pipeline

on:
  push:
    branches:
      - qa
      - stage
      - main

jobs:

  build:
    runs-on: ubuntu-latest
    outputs:
      artifact_name: app-${{ github.sha }}
    steps:
      - name: Build
        run: |
          echo "Building artifact"
          echo "artifact-${{ github.sha }}" > artifact.txt

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-${{ github.sha }}
          path: artifact.txt

  unit-test:
    if: github.ref == 'refs/heads/qa'
    runs-on: ubuntu-latest
    needs: build
    steps:
      - run: echo "Running unit tests"

  deploy-qa:
    if: github.ref == 'refs/heads/qa'
    needs: [build, unit-test]
    runs-on: ubuntu-latest
    environment: qa-env
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: app-${{ github.sha }}

      - run: echo "Deploying to QA"

  integration-test:
    if: github.ref == 'refs/heads/stage' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: build
    steps:
      - run: echo "Running integration tests"

  deploy-stage:
    if: github.ref == 'refs/heads/stage'
    needs: integration-test
    runs-on: ubuntu-latest
    environment: stage-env
    steps:
      - run: echo "Deploying to Stage"

  deploy-prod:
    if: github.ref == 'refs/heads/main'
    needs: integration-test
    runs-on: ubuntu-latest
    environment: prod-env
    steps:
      - run: echo "Deploying to Production"